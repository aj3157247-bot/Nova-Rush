name: Validate Godot project
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
      - name: Import project
        run: godot --headless --editor --path . --quit
      - name: Check project starts
        run: godot --headless --path . --quit-after 5
